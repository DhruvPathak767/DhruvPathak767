name: Generate Contribution Snake

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Contribution Snake Animation

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: DhruvPathak767
          outputs: |
            assets/stats/github-contribution-grid-snake.svg
            assets/stats/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push snake animation
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push
